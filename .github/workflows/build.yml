# ============================================================
# Workflow Name: MyFirstApp CI
# Purpose: Build ASP.NET MVC application and run MSTest cases
# Trigger: Push, Pull Request, or Manual execution
# ============================================================

name: MyFirstApp CI

# Run this workflow when code is pushed or a pull request is created for main
on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  # Allows you to start the workflow manually from GitHub Actions
  workflow_dispatch:

jobs:
  build:
    name: Build Application and Run Test Cases
    runs-on: windows-latest

    steps:
      # Step 1: Download the repository code to the GitHub runner
      - name: "1. CHECKOUT - Download Source Code"
        uses: actions/checkout@v4

      # Step 2: Configure MSBuild to compile the ASP.NET MVC project
      - name: "2. SETUP - Configure MSBuild"
        uses: microsoft/setup-msbuild@v2

      # Step 3: Configure NuGet for restoring project dependencies
      - name: "3. SETUP - Configure NuGet"
        uses: NuGet/setup-nuget@v2

      # Step 4: Restore NuGet dependencies for the solution
      # If this step fails, check package sources and project configuration
      - name: "4. RESTORE - Download NuGet Packages"
        run: nuget restore MyFirstApp.slnx

      # Step 5: Build the main ASP.NET MVC application
      # If this step fails, check C# compilation errors and missing references
      - name: "5. BUILD - Compile MVC Application"
        run: msbuild "MyFirstApp/MyFirstApp.csproj" -t:Rebuild -p:Configuration=Debug

      # Step 6: Build the MSTest project containing HomeControllerTests.cs
      # If this step fails, check the test project, MSTest packages, and references
      - name: "6. BUILD - Compile Test Project"
        run: msbuild "MyFirstApp.Tests/MyFirstApp.Tests.csproj" -t:Build -p:Configuration=Debug

      
      
      # Step 7: Locate Visual Studio Test Runner and execute MSTest cases
      - name: "7. TEST - Run MSTest Test Cases"
        shell: pwsh
        run: |
          Write-Host "============================================"
          Write-Host "Starting MSTest execution..."
          Write-Host "============================================"

          $testDll = Get-ChildItem "MyFirstApp.Tests/bin/Debug" `
            -Filter "MyFirstApp.Tests.dll" `
            -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $testDll) {
            throw "FAILED: Test DLL not found. Check Step 6."
          }

          Write-Host "Test assembly found: $($testDll.FullName)"

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          if (-not (Test-Path $vswhere)) {
            throw "FAILED: vswhere.exe was not found."
          }

          $vsPath = & $vswhere -latest -products '*' -property installationPath

          if (-not $vsPath) {
            throw "FAILED: Visual Studio installation was not found."
          }

          $vstestPath = Join-Path $vsPath "Common7\IDE\CommonExtensions\Microsoft\TestWindow\vstest.console.exe"

          if (-not (Test-Path $vstestPath)) {
            throw "FAILED: vstest.console.exe was not found at $vstestPath"
          }

          Write-Host "Running tests with: $vstestPath"

          & $vstestPath $testDll.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "FAILED: One or more tests failed, or test execution failed."
          }

          Write-Host "PASSED: MSTest execution completed successfully."

      # Step 8: Report success only when all previous steps pass
      - name: "8. SUCCESS - Build and Tests Passed"
        if: ${{ success() }}
        run: 'echo "SUCCESS: Application built and test execution passed."'
